<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Animated Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
  </style>
  <script src="/config.js"></script>
</head>
<body>
  <canvas id="solarSystem"></canvas>

  <script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');
    const TARGET_FPS = 45;

    let lastFrameTime = 0;
    let dpr = window.devicePixelRatio || 1;
    let width, height, centerX, centerY;
    let stars = [];
    let angle = 0;
    let time = 0;
    let moonAngle = Math.random() * Math.PI * 2;

    // Planet configuration (kept immutable)
    const planetConfigs = [
      { name: 'Mercury', dist: 0.08, size: 0.012, color: '#A5A5A5', speed: 0.025 },
      { name: 'Venus',   dist: 0.12, size: 0.018, color: '#E3BB76', speed: 0.018 },
      { name: 'Earth',   dist: 0.16, size: 0.020, color: '#4F86F7', speed: 0.014 },
      { name: 'Mars',    dist: 0.20, size: 0.015, color: '#E27B58', speed: 0.011 },
      { name: 'Jupiter', dist: 0.28, size: 0.045, color: '#D4A373', speed: 0.007 },
      { name: 'Saturn',  dist: 0.36, size: 0.038, color: '#F0D9A8', speed: 0.005, ring: true },
      { name: 'Uranus',  dist: 0.44, size: 0.028, color: '#7DE3F4', speed: 0.0035 },
      { name: 'Neptune', dist: 0.52, size: 0.025, color: '#3E54E8', speed: 0.0025 }
    ];

    function init() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.scale(dpr, dpr);
      centerX = width / 2;
      centerY = height / 2;
      generateStars();
    }

    function generateStars() {
      stars = [];
      const count = Math.floor((width * height) / 1500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + 0.5,
          baseAlpha: Math.random() * 0.7 + 0.3,
          color: i % 40 === 0?'blue': i % 20 === 0 ? 'gold' : 'white', // Add some red stars for variety
          speed: Math.random() * 5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    window.addEventListener('resize', init);
    init();

    // Safe 3D gradient generator with finite-value guards
    function get3DGradient(x, y, radius, baseColor, lightX, lightY) {
      const safeRadius = Math.max(1, Math.min(isFinite(radius) ? radius : 1, 5000));
      
      if (!isFinite(x) || !isFinite(y) || !isFinite(lightX) || !isFinite(lightY)) {
        return ctx.createLinearGradient(x, y, x + safeRadius, y);
      }

      const dx = lightX - x;
      const dy = lightY - y;
      const dist = Math.hypot(dx, dy) || 1;
      const nx = dx / dist;
      const ny = dy / dist;

      const gx = x + nx * safeRadius * 0.5;
      const gy = y + ny * safeRadius * 0.5;

      const grad = ctx.createRadialGradient(gx, gy, safeRadius * 0.05, x, y, safeRadius);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.4, baseColor);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.85)');
      return grad;
    }

    function drawStars() {
      stars.forEach(star => {
        const twinkle = Math.sin(time * star.speed + star.phase);
        const alpha = star.baseAlpha * (0.65 + 0.35 * twinkle);
        ctx.beginPath();
        var color = `rgba(255, 215, 0, ${alpha})`
        if (star.color === 'white') {
          color = `rgba(255, 255, 255, ${alpha})`
        } else if (star.color === 'blue') {
          color = `rgba(137, 207, 240, ${alpha})`
        }
        ctx.fillStyle = color;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawSun() {
      const sunGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
      sunGrad.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
      sunGrad.addColorStop(0.5, 'rgba(255, 140, 0, 0.3)');
      sunGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.shadowColor = '#FF8C00';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawOrbit(distance) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPlanet(config, pos) {
      drawOrbit(pos.dist);

      const grad = get3DGradient(pos.x, pos.y, pos.size, config.color, centerX, centerY);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, pos.size, 0, Math.PI * 2);
      ctx.fill();

      // Outer glow
      ctx.shadowColor = config.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, pos.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (config.ring) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(210, 190, 150, 0.5)';
        ctx.lineWidth = pos.size * 0.35;
        ctx.ellipse(pos.x, pos.y, pos.size * 2.3, pos.size * 0.6, pos.angle + Math.PI/2, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = '#fff';
      ctx.font = `${Math.max(10, Math.min(14, width * 0.008))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(config.name, pos.x, pos.y + pos.size + 14);
    }

    function drawMoon(earthPos) {
      const moonDist = Math.min(width, height) * 0.045;
      moonAngle += 0.009;
      const mx = earthPos.x + Math.cos(moonAngle) * moonDist;
      const my = earthPos.y + Math.sin(moonAngle) * moonDist;
      const mSize = Math.max(3, Math.min(width, height) * 0.01);

      // Orbit trail
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(200, 200, 200, 0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.arc(earthPos.x, earthPos.y, moonDist, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3D Moon
      const moonGrad = get3DGradient(mx, my, mSize, '#B8B8B8', centerX, centerY);
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(mx, my, mSize, 0, Math.PI * 2);
      ctx.fill();

      // Crater shading
      ctx.fillStyle = 'rgba(60, 60, 60, 0.4)';
      ctx.beginPath(); ctx.arc(mx + mSize*0.25, my - mSize*0.15, mSize*0.28, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(80, 80, 80, 0.3)';
      ctx.beginPath(); ctx.arc(mx - mSize*0.3, my + mSize*0.2, mSize*0.18, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#ddd';
      ctx.font = `${Math.max(8, Math.min(10, width * 0.005))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('Moon', mx, my + mSize + 9);
    }


    function animate(timestamp) {
      requestAnimationFrame(animate);
      if (timestamp - lastFrameTime < 1000 / TARGET_FPS) return;
      lastFrameTime = timestamp;

      time += 0.016;
      ctx.fillStyle = '#0B0C10';
      ctx.fillRect(0, 0, width, height);

      drawStars();
      drawSun();

      let earthPos = { x: 0, y: 0, dist: 0, size: 0, angle: 0 };

      planetConfigs.forEach((p) => {
        // Compute rendered values locally to avoid mutating config
        const dist = Math.min(width, height) * p.dist;
        const renderSize = Math.max(4, Math.min(width, height) * p.size);
        const a = angle * p.speed;
        const x = centerX + Math.cos(a) * dist;
        const y = centerY + Math.sin(a) * dist;

        const pos = { x, y, dist, size: renderSize, angle: a };
        drawPlanet(p, pos);

        if (p.name === 'Earth') earthPos = pos;
      });

      drawMoon(earthPos);
      angle += 2;

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
